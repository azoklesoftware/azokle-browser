app-id: com.azokle.browser
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: azokle-browser-linux
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: azokle-browser
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: dir
        path: ../../../..
