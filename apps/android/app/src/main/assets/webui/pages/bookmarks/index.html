<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azokle Bookmarks Manager</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .bookmark-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: all var(--transition-fast);
    }
    .bookmark-card:hover {
      border-color: var(--border-active);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .bookmark-favicon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .bookmark-meta h4 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bookmark-meta p {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="webui-container">
    <header class="webui-header">
      <div class="webui-title-group">
        <div class="webui-icon">⭐</div>
        <div>
          <h1 class="webui-title">Bookmarks</h1>
          <p class="webui-subtitle">Encrypted Sovereign Bookmark Store</p>
        </div>
      </div>
      <button class="btn" id="add-bookmark">+ Add Bookmark</button>
    </header>

    <div class="bookmarks-grid">
      <a class="bookmark-card" href="https://search.azokle.com">
        <div class="bookmark-favicon">🔍</div>
        <div class="bookmark-meta">
          <h4>Azokle Search</h4>
          <p>search.azokle.com</p>
        </div>
      </a>
      <a class="bookmark-card" href="https://github.com">
        <div class="bookmark-favicon">🐙</div>
        <div class="bookmark-meta">
          <h4>GitHub</h4>
          <p>github.com</p>
        </div>
      </a>
      <a class="bookmark-card" href="https://news.ycombinator.com">
        <div class="bookmark-favicon">⚡</div>
        <div class="bookmark-meta">
          <h4>Hacker News</h4>
          <p>news.ycombinator.com</p>
        </div>
      </a>
      <a class="bookmark-card" href="https://wikipedia.org">
        <div class="bookmark-favicon">📖</div>
        <div class="bookmark-meta">
          <h4>Wikipedia</h4>
          <p>wikipedia.org</p>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
