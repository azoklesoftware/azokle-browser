name: 🐛 Bug Report
description: Report a bug, crash, or unexpected behavior in Azokle Browser.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify that this is not a security vulnerability. If it is, please report it via [SECURITY.md](../SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happens and what you expected to happen...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Open Azokle Browser
        2. Navigate to '...'
        3. Click on '....'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Azokle Browser does this affect?
      options:
        - "Android Application (apps/android)"
        - "GeckoView Engine & Prompt Delegates"
        - "Reader Mode & Text-to-Speech"
        - "Password Vault & Autofill"
        - "AdBlock & Tracker Shield"
        - "Tor Onion Circuits"
        - "DNS-over-HTTPS (DoH)"
        - "PWA / External Navigation"
        - "Rust Core Workspace (crates/*)"
        - "Linux Desktop (apps/linux)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Version
      description: Browser version, Android version, device model, or OS.
      placeholder: Azokle v2.0.6, Android 15, Pixel 8 Pro
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logcat or Console Output
      description: Relevant logcat or console outputs (please omit private personal data).
      render: shell
