name: F-Droid Build & Release Pipeline

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release/debug)'
        required: false
        default: 'release'

permissions:
  contents: write

jobs:
  fdroid-metadata-lint:
    name: Verify F-Droid Metadata & FOSS Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Fastlane Metadata Structure
        run: |
          echo "Verifying F-Droid Fastlane metadata..."
          METADATA_DIR="apps/android/fastlane/metadata/android/en-US"
          test -f "$METADATA_DIR/title.txt" || (echo "Missing title.txt" && exit 1)
          test -f "$METADATA_DIR/short_description.txt" || (echo "Missing short_description.txt" && exit 1)
          test -f "$METADATA_DIR/full_description.txt" || (echo "Missing full_description.txt" && exit 1)
          test -f "$METADATA_DIR/images/icon.png" || (echo "Missing icon.png" && exit 1)
          test -d "$METADATA_DIR/images/phoneScreenshots" || (echo "Missing phoneScreenshots" && exit 1)
          test -f ".fdroid.yml" || (echo "Missing .fdroid.yml" && exit 1)
          echo "All F-Droid metadata files, icon, and screenshots are valid and present."

      - name: Scan for Proprietary Tracking SDKs (Zero Anti-Features)
        run: |
          echo "Scanning for proprietary tracking SDKs..."
          FORBIDDEN_PATTERNS="play-services-ads firebase-analytics crashlytics appsflyer adjust"
          FOUND=0
          for PATTERN in $FORBIDDEN_PATTERNS; do
            if grep -rnwi "apps/android" -e "$PATTERN" --include="*.gradle" --include="*.gradle.kts" 2>/dev/null; then
              echo "Error: Proprietary tracking dependency detected: $PATTERN"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then
            echo "F-Droid anti-feature check failed!"
            exit 1
          fi
          echo "Zero proprietary tracking dependencies found. 100% FOSS compliant."

  fdroid-build:
    name: Build & Package F-Droid APK
    needs: fdroid-metadata-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Set up Android NDK & cargo-ndk
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            DETECTED_NDK=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$DETECTED_NDK" ] && [ -d "$DETECTED_NDK" ]; then
              export ANDROID_NDK_HOME="$DETECTED_NDK"
            fi
          fi
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "Installing Android NDK via sdkmanager..."
            sdkmanager --install "ndk;27.0.12077973"
            export ANDROID_NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.0.12077973"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "Resolved ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          if ! command -v cargo-ndk &> /dev/null; then
            echo "Installing cargo-ndk..."
            cargo install cargo-ndk --locked
          fi

      - name: Build Native JNI Libraries
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android \
            -o apps/android/app/src/main/jniLibs \
            build --release -p azokle-jni
          echo "Verifying compiled native JNI libraries:"
          ls -la apps/android/app/src/main/jniLibs/*/*.so

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Grant Execute Permissions
        run: chmod +x apps/android/gradlew

      - name: Run Unit Tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release signing keystore..."
            mkdir -p "${{ runner.temp }}/keystore"
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/keystore/release.jks"
            echo "Keystore successfully placed at ${{ runner.temp }}/keystore/release.jks"
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 secret not provided; refusing to publish unsigned release APK."
            exit 1
          fi

      - name: Build F-Droid APKs
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Building Release APK for F-Droid..."
          ./gradlew assembleRelease

      - name: Clean Up Keystore
        if: always()
        run: rm -rf "${{ runner.temp }}/keystore"

      - name: Compute Reproducible SHA-256 Checksums
        run: |
          mkdir -p artifacts
          cp apps/android/app/build/outputs/apk/release/*.apk artifacts/ 2>/dev/null || true
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdroid-apk-artifacts
          path: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt

      - name: Attach F-Droid Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
