name: Continuous Integration

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust Core Workspace (Lint & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Unit & Integration Tests
        run: cargo test --workspace

  android-app:
    name: Android Application (Tests & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permissions
        run: chmod +x apps/android/gradlew

      - name: Run Unit Tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest

      - name: Generate CycloneDX SBOM
        working-directory: apps/android
        run: ./gradlew generateSbom

      - name: Build Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: azokle-browser-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
