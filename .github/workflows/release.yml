name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_flavor:
        description: 'Release build flavor'
        required: false
        default: 'release'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permissions
        run: chmod +x apps/android/gradlew

      - name: Run Unit Tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest

      - name: Generate CycloneDX SBOM
        working-directory: apps/android
        run: ./gradlew generateSbom

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release signing keystore..."
            mkdir -p "${{ runner.temp }}/keystore"
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/keystore/release.jks"
            echo "Keystore successfully placed at ${{ runner.temp }}/keystore/release.jks"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided; build will use fallback/debug signing."
          fi

      - name: Build Signed Release APKs
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "${{ runner.temp }}/keystore/release.jks" ]; then
            echo "Building signed Release APKs..."
            ./gradlew assembleRelease
          else
            echo "Keystore not present; building Debug APKs as fallback..."
            ./gradlew assembleDebug
          fi

      - name: Clean Up Keystore
        if: always()
        run: rm -rf "${{ runner.temp }}/keystore"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            apps/android/app/build/outputs/apk/**/*.apk
            apps/android/app/build/reports/sbom.json
