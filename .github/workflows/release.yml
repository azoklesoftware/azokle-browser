name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_flavor:
        description: 'Release build flavor'
        required: false
        default: 'release'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Set up Android NDK & cargo-ndk
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            DETECTED_NDK=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$DETECTED_NDK" ] && [ -d "$DETECTED_NDK" ]; then
              export ANDROID_NDK_HOME="$DETECTED_NDK"
            fi
          fi
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "Installing Android NDK via sdkmanager..."
            sdkmanager --install "ndk;27.0.12077973"
            export ANDROID_NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.0.12077973"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "Resolved ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          if ! command -v cargo-ndk &> /dev/null; then
            echo "Installing cargo-ndk..."
            cargo install cargo-ndk --locked
          fi

      - name: Build Native JNI Libraries
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android \
            -o apps/android/app/src/main/jniLibs \
            build --release -p azokle-jni
          echo "Verifying compiled native JNI libraries:"
          ls -la apps/android/app/src/main/jniLibs/*/*.so

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@d156388eb19639ec20ade50009f3d199ce1e2808 # v4.1.0

      - name: Grant Execute Permissions
        run: chmod +x apps/android/gradlew

      - name: Run Unit Tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest

      - name: Generate CycloneDX SBOM
        working-directory: apps/android
        run: ./gradlew generateSbom

      - name: Validate and Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured! Refusing to build unsigned or debug release."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS secret is missing!"
            exit 1
          fi
          echo "Decoding release signing keystore..."
          mkdir -p "${{ runner.temp }}/keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/keystore/release.jks"
          if [ ! -s "${{ runner.temp }}/keystore/release.jks" ]; then
            echo "::error::Decoded keystore file is empty or corrupted!"
            exit 1
          fi
          echo "Keystore successfully placed and verified at ${{ runner.temp }}/keystore/release.jks"

      - name: Build Signed Release APKs
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Building signed Release APKs..."
          ./gradlew assembleRelease

      - name: Verify Signed Release APKs
        run: |
          RELEASE_APKS=$(find apps/android/app/build/outputs/apk/release -name "*.apk")
          if [ -z "$RELEASE_APKS" ]; then
            echo "::error::No release APKs were generated in apps/android/app/build/outputs/apk/release!"
            exit 1
          fi
          echo "Generated release APKs:"
          echo "$RELEASE_APKS"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            for apk in $RELEASE_APKS; do
              echo "Verifying APK signature: $apk"
              "$APKSIGNER" verify --verbose "$apk" || {
                echo "::error::APK signature verification failed for $apk"
                exit 1
              }
            done
          else
            echo "Notice: apksigner not found in Android build-tools; skipping apksigner step."
          fi

      - name: Clean Up Keystore
        if: always()
        run: rm -rf "${{ runner.temp }}/keystore"

      - name: Compute Release Checksums
        run: |
          cd apps/android/app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/apk/release/SHA256SUMS.txt
            apps/android/app/build/reports/sbom.json
