[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/core",
    "crates/privacy/adblock",
    "crates/privacy/tracker-block",
    "crates/privacy/adblock-rust",
    "crates/services/tabs",
    "crates/services/history",
    "crates/services/downloads",
    "crates/services/permissions",
    "crates/services/bookmarks",
    "crates/services/search",
    "crates/services/sync",
    "crates/crypto",
    "crates/security",
    "crates/storage",
    "crates/tor",
    "crates/networking",
    "crates/protocol",
    "bindings/kotlin",
    "bindings/c",
    "bindings/uniffi",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Azokle Developer <dev@azokle.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
aho-corasick = "1.1"
regex = "1.10"
url = "2.5"
argon2 = { version = "0.5", features = ["std", "rand"] }
chacha20poly1305 = "0.11"
p256 = { version = "0.14", features = ["ecdsa"] }
ciborium = "0.2"
base64ct = { version = "1.8", features = ["alloc"] }
sha2 = "0.11"
rand = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"
log = "0.4"
android_logger = "0.15"
jni = "0.21"
parking_lot = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

